# Site settings. After editing this file, restart `jekyll serve` to see changes.
title: My Blog
description: Notes, projects, and things I'm learning.
author: JMu

# Served from the custom domain in CNAME (site root), so no path prefix.
url: "https://blog.jettm.dev"
baseurl: ""

theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

permalink: /:year/:month/:day/:title/

exclude:
  - README.md
  - new-post.sh
  - Gemfile
  - Gemfile.lock
  - vendor
